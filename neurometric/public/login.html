<!DOCTYPE html>
<!--
  NeuroMetric — Entrar (login)
  Origem: tela "Entrar" exportada do Google Stitch (docs/stitch-original/login-original.html).
  Mudanças em relação ao original:
    - Tailwind CDN e <style> interno substituídos pelo style.css externo (mesmos valores);
    - eventos inline (onclick/onsubmit) movidos para js/auth.js;
    - o formulário de cadastro vive em cadastro.html (a aba "Criar Conta" navega para lá);
    - mensagens de erro reais vindas do servidor.
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — NeuroMetric</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <link rel="stylesheet" href="style.css">
</head>
<body class="page auth-page">
  <main class="auth-main">
    <div class="auth-stage auth-stage--login">
      <div class="auth-glow auth-glow--primary" aria-hidden="true"></div>
      <div class="auth-glow auth-glow--tertiary" aria-hidden="true"></div>

      <div class="auth-card--login">
        <!-- Cabeçalho: logo e selo de segurança -->
        <div class="auth-head auth-head--login">
          <a class="auth-brand auth-brand--login" href="index.html">
            <span class="brand-mark brand-mark--sm">
              <span class="material-symbols-outlined icon-base">psychology</span>
            </span>
            <span class="auth-brand__name">NEUROMETRIC</span>
          </a>
          <div class="ssl-badge ssl-badge--login">
            <span class="dot dot-6 dot-primary anim-pulse"></span>
            <span>SSL 256-bit</span>
          </div>
        </div>

        <!-- Abas -->
        <div class="auth-tabs auth-tabs--login">
          <button class="auth-tab is-active" id="tab-login" type="button" aria-current="page">
            <span class="material-symbols-outlined icon-sm">login</span>
            <span>Entrar</span>
          </button>
          <button class="auth-tab" id="tab-register" type="button" data-href="cadastro.html">
            <span class="material-symbols-outlined icon-sm">person_add</span>
            <span>Criar Conta</span>
          </button>
        </div>

        <!-- Formulário de login -->
        <div id="view-login">
          <div class="auth-intro">
            <h1 class="auth-title auth-title--login">Preencha os campos para realizar o seu teste</h1>
            <p class="auth-subtitle">Informe seus dados para acessar sua avaliação cognitiva.</p>
          </div>

          <form class="auth-form--login" id="form-login" novalidate>
            <div>
              <label class="field-label field-label--login" for="login-email">E-mail institucional ou pessoal</label>
              <div class="field-box">
                <span class="material-symbols-outlined field-icon field-icon--login">mail</span>
                <input class="auth-input auth-input--login" id="login-email" name="email" type="email"
                       placeholder="Digite seu e-mail" autocomplete="email" required>
              </div>
            </div>

            <div>
              <label class="field-label field-label--login" for="login-password">Senha de acesso</label>
              <div class="field-box">
                <span class="material-symbols-outlined field-icon field-icon--login">lock</span>
                <input class="auth-input auth-input--login auth-input--with-eye" id="login-password" name="password"
                       type="password" placeholder="••••••••" autocomplete="current-password" required>
                <button class="eye-toggle eye-toggle--login" type="button" data-toggle-password="login-password"
                        aria-label="Alternar visibilidade da senha">
                  <span class="material-symbols-outlined icon-lg">visibility</span>
                </button>
              </div>
            </div>

            <div class="auth-options">
              <label class="check-inline">
                <input class="check-native" id="login-remember" name="remember" type="checkbox">
                <span class="text-body-sm">Lembrar de mim</span>
              </label>
              <a class="link-label" href="recuperar-senha.html">Esqueci minha senha</a>
            </div>

            <div class="alert alert--inline alert--error" id="login-error" role="alert" hidden>
              <span class="material-symbols-outlined icon-base">error</span>
              <span id="login-error-msg"></span>
            </div>

            <button class="btn-gradient btn-gradient--login" type="submit">
              <span>Entrar</span>
              <span class="material-symbols-outlined icon-base">arrow_forward</span>
            </button>
          </form>

          <div class="divider divider--login">
            <div class="divider__line"></div>
            <span class="divider__text">ou</span>
            <div class="divider__line"></div>
          </div>

          <button class="btn-google btn-google--login" id="btn-google" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
            </svg>
            <span>Continuar com Google</span>
          </button>

          <p class="auth-switch auth-switch--login">
            Não possui uma conta?
            <a class="auth-switch__link" href="cadastro.html">Cadastre-se</a>
          </p>
        </div>
      </div>

      <div class="auth-legal auth-legal--login">
        <span class="auth-legal__item">
          <span class="material-symbols-outlined icon-sm">verified_user</span> Protocolo ISO/IEC 27001
        </span>
        <span>•</span>
        <span>Avaliação Psicométrica V4.2</span>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
