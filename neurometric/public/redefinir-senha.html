<!DOCTYPE html>
<!-- NeuroMetric — Redefinição de senha (link recebido por e-mail). Reaproveita o card e os estilos da tela de cadastro do Stitch. -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova senha — NeuroMetric</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <link rel="stylesheet" href="style.css">
</head>
<body class="page auth-page">
  <main class="auth-main">
    <div class="auth-stage">
      <div class="auth-card--register">
        <div class="auth-head auth-head--register">
          <a class="auth-brand auth-brand--register" href="index.html">
            <span class="brand-mark brand-mark--glow">
              <span class="material-symbols-outlined icon-20">psychology</span>
            </span>
            <span class="auth-brand__text">
              <span class="auth-brand__name auth-brand__name--tight">NEUROMETRIC</span>
              <span class="auth-brand__sub">Psychometrics</span>
            </span>
          </a>
          <div class="ssl-badge ssl-badge--register">
            <span class="dot dot-6 dot-success anim-pulse"></span>
            <span>SSL 256-bit</span>
          </div>
        </div>
        <div class="alert alert--banner alert--error" id="reset-msg-box" role="alert" hidden>
          <span class="material-symbols-outlined icon-18">info</span>
          <span id="reset-msg"></span>
        </div>
        <div class="auth-intro">
          <h1 class="auth-title auth-title--register">Crie uma nova senha</h1>
          <p class="auth-subtitle">Use no mínimo 8 caracteres, com letras e números.</p>
        </div>
        <form class="auth-form--register" id="form-reset" novalidate>
            <div class="field">
              <label class="field-label field-label--register" for="reset-password">Nova senha</label>
              <div class="field-box">
                <span class="material-symbols-outlined field-icon field-icon--register">lock</span>
                <input class="auth-input auth-input--register auth-input--with-eye" id="reset-password" type="password" placeholder="Digite a nova senha" autocomplete="new-password" required>
                <button class="eye-toggle eye-toggle--register" type="button" data-toggle-password="reset-password" aria-label="Mostrar senha">
                  <span class="material-symbols-outlined icon-20">visibility</span>
                </button>
              </div>
            </div>
            <div class="field">
              <label class="field-label field-label--register" for="reset-confirm">Confirme a nova senha</label>
              <div class="field-box">
                <span class="material-symbols-outlined field-icon field-icon--register">lock_reset</span>
                <input class="auth-input auth-input--register auth-input--with-eye" id="reset-confirm" type="password" placeholder="Digite a nova senha novamente" autocomplete="new-password" required>
                <button class="eye-toggle eye-toggle--register" type="button" data-toggle-password="reset-confirm" aria-label="Mostrar senha">
                  <span class="material-symbols-outlined icon-20">visibility</span>
                </button>
              </div>
            </div>
            <button class="btn-gradient btn-gradient--register" type="submit">
              <span>Salvar nova senha</span>
              <span class="material-symbols-outlined icon-18">arrow_forward</span>
            </button>
        </form>
        <div class="auth-switch auth-switch--register">
          <p>Lembrou a senha? <a class="auth-switch__link" href="login.html">Entrar</a></p>
        </div>
      </div>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
